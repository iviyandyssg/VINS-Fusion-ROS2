%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2 

# imu_topic: "/Sim/SceneNonphysicsDrone/robots/Drone1/sensors/IMU1/imu_kinematics"
# image0_topic: "/Sim/SceneNonphysicsDrone/robots/Drone1/sensors/LeftCamera/scene_camera/image"
# image1_topic: "/Sim/SceneNonphysicsDrone/robots/Drone1/sensors/RightCamera/scene_camera/image"
output_path: "/run/media/sydai/disk/git_ws/vins_ws/src/script/results_pool/baseline/rosbag2_2026_05_22-18_05_36_baseline/001"
imu_topic: "/imu/data_raw"
image0_topic: "/camera/left"
image1_topic: "/camera/right"

cam0_calib: "cam0_pinhole.yaml"
cam1_calib: "cam1_pinhole.yaml"
# image_width: 640
# image_height: 480
image_width: 960
image_height: 540

# GPU acceleration
use_gpu         : 0
use_gpu_acc_flow: 0
use_gpu_ceres   : 0
   

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

# body_T_cam0: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [0, 0, 1, 0.25,
#            -1, 0, 0, 0.03,
#            0,  -1,  0,  0.10,
#            0, 0, 0, 1]

# body_T_cam1: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [0, 0, 1, 0.25,
#            -1, 0, 0, -0.03,
#            0,  -1,  0,  0.10,
#            0, 0, 0, 1]

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.033143,  0.024188,  0.999160,  0.065833,
           0.000000,  0.999707, -0.024193,  0.061311,
           -0.999450,  0.000802,  0.033135,  0.016527,
           0, 0, 0, 1]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.032460,  0.028201,  0.998858,  0.064575,
           0.000000,  0.999602, -0.028218, -0.002218,
           -0.999473,  0.000916,  0.032449,  0.016422,
           0, 0, 0, 1]

#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.1          # accelerometer measurement noise standard deviation. 
gyr_n: 0.01         # gyroscope measurement noise standard deviation.     
acc_w: 0.001        # accelerometer bias random work noise standard deviation.  
gyr_w: 0.0001       # gyroscope bias random work noise standard deviation.     
g_norm: 9.81007     # gravity magnitude

# acc_n: 0.2          # accelerometer measurement noise standard deviation. 
# gyr_n: 0.02         # gyroscope measurement noise standard deviation.     
# acc_w: 0.002        # accelerometer bias random work noise standard deviation.  
# gyr_w: 0.0002       # gyroscope bias random work noise standard deviation.  

# acc_n: 1e-2
# gyr_n: 1e-3
# acc_w: 1e-4
# gyr_w: 1e-5
# g_norm: 9.80665

#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "~/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
